<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Building Animation</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #000;
}

body {
    overflow-x: hidden;
}

#scrollArea {
    height: 1000vh;
}

#screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    background: #000;
}

#heroImage {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
</style>
</head>

<body>

<div id="scrollArea"></div>

<div id="screen">
    <img id="heroImage" src="frame_001.jpg" alt="">
</div>

<script>

const TOTAL_FRAMES = 108;

const imageElement =
    document.getElementById("heroImage");

const frames = [];

let currentFrame = 1;


/* =========================
   ساخت و preload فریم‌ها
========================= */

for (let i = 1; i <= TOTAL_FRAMES; i++) {

    const img = new Image();

    img.src =
        "frame_" +
        String(i).padStart(3, "0") +
        ".jpg";

    frames.push(img);
}


/* =========================
   تغییر فریم
========================= */

function showFrame(number) {

    number = Math.max(
        1,
        Math.min(TOTAL_FRAMES, number)
    );

    if (number === currentFrame) {
        return;
    }

    currentFrame = number;

    /*
      اگر تصویر قبلاً دانلود شده باشد،
      فوراً نمایش داده می‌شود.
    */

    if (frames[number - 1].complete) {

        imageElement.src =
            frames[number - 1].src;

    }

}


/* =========================
   محاسبه فریم از اسکرول
========================= */

function update() {

    const maxScroll =
        document.documentElement.scrollHeight -
        window.innerHeight;

    if (maxScroll <= 0) {
        return;
    }

    const progress =
        window.scrollY / maxScroll;

    const frame =
        Math.round(
            progress * (TOTAL_FRAMES - 1)
        ) + 1;

    showFrame(frame);
}


/* =========================
   اسکرول
========================= */

window.addEventListener(
    "scroll",
    update,
    { passive: true }
);


/* =========================
   شروع
========================= */

update();

</script>

</body>
</html>
