<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Building Scroll Animation</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #000;
}

body {
    overflow-x: hidden;
}

/* مسیر اسکرول */
#scroll-area {
    height: 800vh;
}

/* تصویر ثابت */
#viewer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    background: #000;
    overflow: hidden;
}

#hero-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
</style>
</head>

<body>

<div id="scroll-area"></div>

<div id="viewer">
    <img
        id="hero-image"
        src="frame_001.jpg"
        alt=""
    >
</div>


<script>

"use strict";


/* =====================================================
   تنظیمات
===================================================== */

const TOTAL_FRAMES = 108;

/*
  تعداد فریم‌هایی که جلوتر از فریم فعلی
  با اولویت بالا دانلود می‌شوند.
*/
const PRIORITY_AHEAD = 10;

/*
  تعداد فریم‌هایی که عقب‌تر preload می‌شوند.
*/
const PRIORITY_BEHIND = 5;


/* =====================================================
   عناصر
===================================================== */

const imageElement =
    document.getElementById("hero-image");


/* =====================================================
   حافظه فریم‌ها
===================================================== */

const frames = new Array(TOTAL_FRAMES);

const loaded = new Array(TOTAL_FRAMES).fill(false);

const loading = new Array(TOTAL_FRAMES).fill(false);


/* =====================================================
   فریم فعلی
===================================================== */

let currentFrame = 0;

let targetFrame = 0;


/* =====================================================
   ساخت نام فایل
===================================================== */

function frameURL(index) {

    const number =
        String(index + 1).padStart(3, "0");

    return "frame_" + number + ".jpg";

}


/* =====================================================
   دانلود یک فریم
===================================================== */

function loadFrame(index) {

    if (
        index < 0 ||
        index >= TOTAL_FRAMES
    ) {
        return;
    }

    if (loaded[index] || loading[index]) {
        return;
    }


    loading[index] = true;


    const img = new Image();


    img.onload = function () {

        frames[index] = img;

        loaded[index] = true;

        loading[index] = false;


        /*
          اگر این همان فریمی است که کاربر
          الان می‌خواهد، فوراً نمایش بده.
        */

        if (index === targetFrame) {

            showLoadedFrame(index);

        }

    };


    img.onerror = function () {

        loading[index] = false;

    };


    img.src = frameURL(index);

}


/* =====================================================
   نمایش فریم آماده
===================================================== */

function showLoadedFrame(index) {

    if (!loaded[index]) {
        return;
    }

    imageElement.src =
        frames[index].src;

    currentFrame = index;

}


/* =====================================================
   پیدا کردن نزدیک‌ترین فریم آماده
===================================================== */

function showNearestLoaded(index) {

    if (loaded[index]) {

        showLoadedFrame(index);

        return;

    }


    /*
      اول به جلو نگاه می‌کنیم
    */

    for (
        let distance = 1;
        distance <= TOTAL_FRAMES;
        distance++
    ) {

        const forward =
            index + distance;

        if (
            forward < TOTAL_FRAMES &&
            loaded[forward]
        ) {

            showLoadedFrame(forward);

            return;

        }


        const backward =
            index - distance;

        if (
            backward >= 0 &&
            loaded[backward]
        ) {

            showLoadedFrame(backward);

            return;

        }

    }

}
