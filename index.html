<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hero Animation</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    body {
      overflow-x: hidden;
    }

    #hero {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    #hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #scroll-space {
      height: 500vh;
    }
  </style>
</head>

<body>

  <div id="hero">
    <img id="heroImage" src="frame_001.jpg" alt="">
  </div>

  <div id="scroll-space"></div>

  <script>
    const totalFrames = 108;
    const image = document.getElementById("heroImage");

    let currentFrame = 1;

    function updateFrame() {

      const maxScroll =
        document.documentElement.scrollHeight -
        window.innerHeight;

      const scrollTop = window.scrollY;

      let progress = scrollTop / maxScroll;

      progress = Math.max(0, Math.min(1, progress));

      const frame =
        Math.floor(progress * (totalFrames - 1)) + 1;

      if (frame !== currentFrame) {

        currentFrame = frame;

        const frameNumber =
          String(frame).padStart(3, "0");

        image.src =
          "frame_" + frameNumber + ".jpg";
      }
    }

    window.addEventListener(
      "scroll",
      updateFrame,
      { passive: true }
    );

    updateFrame();
  </script>

</body>
</html>
