<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hero Scroll Animation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #000;
    }

    body {
      overflow-x: hidden;
    }

    /* فضای اسکرول */
    #hero-wrap {
      position: relative;
      width: 100%;
      height: 500vh;
    }

    /* تصویر هنگام اسکرول ثابت می‌ماند */
    #hero-sticky {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    #hero-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>

<body>

  <section id="hero-wrap">
    <div id="hero-sticky">
      <img
        id="hero-image"
        src="frame_001.jpg"
        alt="Hero Animation"
      >
    </div>
  </section>
