<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ultra Fast Building Animation</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #000;
}

    overflow-x: hidden;
}

/* فضای اسکرول */
#scroll-space {
    height: 900vh;
}

/* نمایشگر ثابت */
#viewer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    background: #000;
    overflow: hidden;
}

#hero {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
</style>
</head>

<body>

<div id="scroll-space"></div>

<div id="viewer">
    <img id="hero" src="frame_001.jpg" alt="">
</div>

"use strict";


/* =====================================================
   تنظیمات
===================================================== */

const TOTAL = 108;

/*
  چند فریم اطراف فریم فعلی آماده شوند
*/
const AHEAD = 12;
const BEHIND = 6;


/* =====================================================
   عناصر
===================================================== */

    document.getElementById("hero");


/* =====================================================
   حافظه
===================================================== */

const cache =
    new Array(TOTAL);

const state =
    new Uint8Array(TOTAL);


/*
state:

0 = هنوز درخواست نشده
1 = در حال دانلود
2 = آماده
*/


/* =====================================================
   وضعیت فعلی
===================================================== */

let wanted = 0;

let lastScroll = 0;
let lastTime = performance.now();

   ساخت URL
===================================================== */

    return (
        "frame_" +
        String(index + 1).padStart(3, "0") +
        ".jpg"
    );

}


/* =====================================================
   دانلود فریم
===================================================== */

function requestFrame(index, priority = false) {

    if (
        index < 0 ||
        index >= TOTAL
    ) {
        return;
    }


    if (state[index] !== 0) {
        return;
    }


    state[index] = 1;


    const img = new Image();


    img.decoding = "async";


    img.onload = function () {

        cache[index] = img;

        state[index] = 2;

          اگر هنوز همین فریم لازم است،
          فوراً نمایش بده.
        */

        if (index === wanted) {

            display(index);

        }

    };
