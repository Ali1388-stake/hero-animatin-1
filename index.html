<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Building Scroll Animation</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #000;
}

body {
    overflow-x: hidden;
}

/* فضای واقعی برای اسکرول */
#scroll-area {
    width: 100%;
    height: 1000vh;
}

/* تصویر همیشه روی صفحه */
#viewer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background: #000;
}

#hero-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
</style>
</head>

<body>

<div id="scroll-area"></div>

<div id="viewer">
    <img id="hero-image" src="frame_001.jpg" alt="">
</div>

<script>

const TOTAL_FRAMES = 108;

const heroImage =
    document.getElementById("hero-image");

const loadedFrames = {};
const loadingFrames = {};

let currentFrame = 1;


/* ساخت نام فایل */
function getFrameName(frame) {
    return "frame_" +
        String(frame).padStart(3, "0") +
        ".jpg";
}


/* لود یک فریم */
function loadFrame(frame) {

    if (frame < 1 || frame > TOTAL_FRAMES) {
        return;
    }

    if (loadedFrames[frame] || loadingFrames[frame]) {
        return;
    }

    loadingFrames[frame] = true;

    const img = new Image();

    img.onload = function() {

        loadedFrames[frame] = img;
        loadingFrames[frame] = false;

        /* اگر همین فریم لازم است، نمایش بده */
        if (frame === currentFrame) {
            heroImage.src = img.src;
        }
    };

    img.onerror = function() {
        loadingFrames[frame] = false;
    };

    img.src = getFrameName(frame);
}


/* نمایش فریم */
function showFrame(frame) {

    if (frame === currentFrame &&
        loadedFrames[frame]) {
        return;
    }

    currentFrame = frame;

    /*
      اگر قبلاً دانلود شده، فوراً نمایش بده
    */
    if (loadedFrames[frame]) {

        heroImage.src =
            loadedFrames[frame].src;

        return;
    }

    /*
      اگر هنوز دانلود نشده، درخواستش کن
    */
    loadFrame(frame);
}


/* محاسبه فریم بر اساس اسکرول */
function updateAnimation() {

    const maxScroll =
        document.documentElement.scrollHeight -
        window.innerHeight;

    if (maxScroll <= 0) {
        return;
    }

    const progress =
        window.scrollY / maxScroll;

    const frame =
        Math.floor(
            progress * (TOTAL_FRAMES - 1)
        ) + 1;

    showFrame(frame);


    /*
      چند فریم جلوتر را هم آماده کن
    */

    for (let i = 1; i <= 8; i++) {
        loadFrame(frame + i);
    }


    /*
      چند فریم عقب‌تر را هم آماده کن
    */

    for (let i = 1; i <= 3; i++) {
        loadFrame(frame - i);
    }
}


/* رویداد اسکرول */
window.addEventListener(
    "scroll",
    updateAnimation,
    { passive: true }
);


/* شروع با فریم اول */
loadFrame(1);


/* شروع انیمیشن */
updateAnimation();

</script>

</body>
</html>
